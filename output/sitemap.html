                .attr('transform', d => `translate(${d.y},${d.x})`);
            
            nodeUpdate.select('circle')
                .attr('fill', d => d._children && !d.children ? '#f5576c' : '#00d4ff');
            
            nodes.exit()
                .transition()
                .duration(duration)
                .attr('transform', d => `translate(${source.y},${source.x})`)
                .remove();
            
            // Links
            const links = g.selectAll('.link')
                .data(root.links(), d => d.target.data.url);
            
            const linkEnter = links.enter()
                .insert('path', 'g')
                .attr('class', 'link')
                .attr('d', d3.linkHorizontal()
                    .x(d => source.y0 || d.y)
                    .y(d => source.x0 || d.x));
            
            linkEnter.merge(links)
                .transition()
                .duration(duration)
                .attr('d', d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));
            
            links.exit()
                .transition()
                .duration(duration)
                .attr('d', d3.linkHorizontal()
                    .x(d => source.y)
                    .y(d => source.x))
                .remove();
            
            // Store positions for transitions
            root.descendants().forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }
        
        function truncate(str, n) {
            return str.length > n ? str.substr(0, n - 1) + '...' : str;
        }
        
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            tooltip.innerHTML = `
                <div class="tooltip-title">${d.data.name}</div>
                <div class="tooltip-url">${d.data.url}</div>
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }
        
        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }
        
        function expandAll() {
            root.descendants().forEach(d => {
                if (d._children) {
                    d.children = d._children;
                }
            });
            update(root);
        }
        
        function collapseAll() {
            root.descendants().forEach(d => {
                if (d.depth > 0 && d.children) {
                    d._children = d.children;
                    d.children = null;
                }
            });
            update(root);
        }
        
        function resetZoom() {
            svg.transition()
                .duration(500)
                .call(zoom.transform, d3.zoomIdentity.translate(100, 50));
        }
        
        // Initial render
        update(root);
        
        // Center the tree initially
        svg.call(zoom.transform, d3.zoomIdentity.translate(100, height / 4).scale(0.8));
    </script>
</body>
</html>
